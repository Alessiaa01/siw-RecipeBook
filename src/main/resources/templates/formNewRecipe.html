<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Ricetta - Disney RecipeBook</title>
    
    <link rel="stylesheet" th:href="@{/css/formNewRecipe.css}" />
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="magic-background"></div>

	<header class="main-header">
	    <div class="header-content-wrapper">
	        
	        <div class="header-left">
	            <div class="btn-home">
	                <a th:href="@{/}"><i class="fa-solid fa-house-chimney"></i> Home</a>
	            </div>
	            <div sec:authorize="hasAuthority('ADMIN')">
	                <a th:href="@{/admin}" class="btn-home-royal"><i class="fa-solid fa-crown"></i> Gestione Admin</a>
	            </div>     
	        </div>
	        
	        <div class="header-right">
	            <div sec:authorize="isAuthenticated()" class="user-profile">
	                <span class="chef-name">
	                    <i class="fa-solid fa-user-circle"></i>
	                    <span th:if="${currentUser != null}" th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Nome Cognome</span>
	                    <span th:if="${currentUser == null}" sec:authentication="name">User</span>
	                </span>
	                <form th:action="@{/logout}" method="post" class="logout">
	                    <button type="submit" class="btn-logout">
	                        Logout <i class="fa-solid fa-right-from-bracket"></i>
	                    </button>
	                </form>
	            </div>
	            
	            <div sec:authorize="!isAuthenticated()" class="guest-actions">
	                <span class="welcome-text">Benvenuto!</span>
	                <div class="admin-link-header-left"> 
	                    <a th:href="@{/login}">Accedi</a>
	                </div>
	                <a th:href="@{/register}" class="btn-gold">Registrati</a>
	            </div>
	        </div>
	        
	    </div>
	</header>
    <div class="single-recipe-card">
        
        <div class="form-title">
            <h1><i class="fas fa-feather-alt"></i> Crea Nuova Ricetta</h1>
        </div>

        <form th:action="@{/formNewRecipe}" th:object="${recipe}" method="POST" id="newRecipeForm">
            
            <div th:if="${#fields.hasGlobalErrors()}" class="error-banner">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="input-group">
                <label>Titolo della Ricetta</label>
                <input type="text" th:field="*{title}" placeholder="" class="magic-input" required/>
                <span style="color: #d32f2f; font-size: 0.9rem;" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="input-group">
                <label>Breve Descrizione</label>
                <textarea th:field="*{description}" rows="2" class="magic-textarea" placeholder=""></textarea>
            </div>

            <div class="details-grid">
			    <div>
			        <label>Categoria</label>
			        <select th:field="*{category}" class="magic-input">
			            <option value="Antipasto">Antipasto</option>
			            <option value="Primo">Primo</option>
			            <option value="Secondo">Secondo</option>
			            <option value="Dolce">Dolce</option>
			            <option value="Altro">Altro</option>
			        </select>
			    </div>
			    <div>
			        <label><i class="fas fa-clock"></i> Tempo (min)</label>
			        <input type="number" th:field="*{preparationTime}" class="magic-input" required/>
			    </div>
			    <div>
			        <label><i class="fas fa-fire"></i> Cottura (min)</label>
			        <input type="number" th:field="*{cookingTime}" class="magic-input"/>
			    </div>
			    <div>
			        <label><i class="fas fa-signal"></i> Difficoltà</label>
			        <select th:field="*{difficulty}" class="magic-input">
                        <option value="Facile">Facile</option>
                        <option value="Media">Media</option>
                        <option value="Difficile">Difficile</option>
                    </select>
			    </div>
			    <div>
			        <label><i class="fas fa-utensils"></i> Porzioni</label>
			        <input type="number" th:field="*{servings}" class="magic-input"/>
			    </div>
			</div> 

            <div class="columns-container">
                
                <div class="ingredients-section">
                    <h3 class="section-header"><i class="fas fa-flask"></i> Ingredienti</h3>
                    
                    <div id="ingredients-container">
                    </div>

                    <button type="button" onclick="addIngredientField()" class="btn-add-dashed">
                        <i class="fas fa-plus"></i> Aggiungi Ingrediente
                    </button>
                </div>

				<div class="procedure-section">
				    
				    <div class="tags-container">
				        <label class="diet-label">
				            <i class="fas fa-leaf"></i> Diete & Intolleranze:
				        </label>
						
				        <div class="checkbox-wrapper">
				            
				            <label class="magic-checkbox-label checkbox-veg">
				                <input type="checkbox" value="Vegetariano" th:field="*{tags}"> 
				                <span><i class="fas fa-carrot"></i> Vegetariano</span>
				            </label>

				            <label class="magic-checkbox-label checkbox-vegan">
				                <input type="checkbox" value="Vegano" th:field="*{tags}"> 
				                <span><i class="fas fa-seedling"></i> Vegano</span>
				            </label>

				            <label class="magic-checkbox-label checkbox-gluten">
				                <input type="checkbox" value="Senza Glutine" th:field="*{tags}"> 
				                <span><i class="fas fa-bread-slice"></i> Senza Glutine</span>
				            </label>

				            <label class="magic-checkbox-label checkbox-lactose">
				                <input type="checkbox" value="Senza Lattosio" th:field="*{tags}"> 
				                <span><i class="fas fa-cheese"></i> Senza Lattosio</span>
				            </label>
				            
				        </div>
				    </div>
					<label class="section-header-styled">
									            <i class="fas fa-scroll"></i>Procedimento:
									        </label>

				    <textarea th:field="*{procedure}" rows="12" class="magic-textarea" placeholder="Scrivi qui i passaggi della preparazione..." required></textarea>
				</div>
            </div>

            <div class="preview-container">
                <div class="polaroid-frame">
                    <img id="preview-img" src="/images/placeholder-piatto.jpg" alt="Anteprima">
                </div>
                <div class="input-group" style="width: 100%; max-width: 600px;">
                    <label>URL Immagine</label>
                    <input type="text" th:field="*{imageUrl}" id="imgUrlInput" oninput="updatePreview()" class="magic-input" placeholder="Incolla qui il link dell'immagine..."/>
                </div>
            </div>

            <div class="footer-buttons">
                <button type="submit" class="btn-gold">Salva Ricetta</button>
				<a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin}" class="btn-gold-outline">
				    Annulla
				</a>

				<a sec:authorize="!hasAuthority('ADMIN')" th:href="@{/myRecipes}" class="btn-gold-outline">
				    Annulla
				</a>
            </div>

        </form>
    </div>

    <script>
        // Funzione Anteprima Immagine
        function updatePreview() {
            const url = document.getElementById('imgUrlInput').value;
            const img = document.getElementById('preview-img');
            if(url) {
                img.src = url;
                img.onerror = function() { this.src = '/images/placeholder-piatto.jpg'; };
            } else {
                img.src = '/images/placeholder-piatto.jpg';
            }
        }

        // --- GESTIONE INGREDIENTI (Javascript Invariato nella logica) ---
        let ingredientIndex = 0;

        function addIngredientField() {
            const container = document.getElementById('ingredients-container');
            const index = ingredientIndex++;
            
            // Creiamo un elemento div per la riga
            const rowDiv = document.createElement('div');
            rowDiv.className = 'ing-row-dynamic';
            rowDiv.id = 'ing-block-' + index;

            // HTML interno con i 3 campi (Classi CSS aggiornate per il nuovo stile)
            rowDiv.innerHTML = `
                <div class="ing-input-group ing-name">
                    <label style="font-size: 0.7rem; margin-bottom: 2px;">Ingrediente</label>
                    <input type="text" name="ingredients[${index}].name" placeholder="" class="magic-input-sm" required />
                </div>
                
                <div class="ing-input-group ing-qty">
                    <label style="font-size: 0.7rem; margin-bottom: 2px;">Qt.</label>
                    <input type="number" name="ingredients[${index}].quantity" placeholder="" class="magic-input-sm" />
                </div>
                
                <div class="ing-input-group ing-unit">
                    <label style="font-size: 0.7rem; margin-bottom: 2px;">Unità</label>
                    <input type="text" name="ingredients[${index}].unit" placeholder="" class="magic-input-sm" />
                </div>
                
                <button type="button" onclick="removeIngredientField(${index})" class="mini-del-btn" title="Rimuovi">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(rowDiv);
        }

        function removeIngredientField(index) {
            const el = document.getElementById('ing-block-' + index);
            if(el) el.remove();
        }

        // Aggiunge la prima riga automaticamente all'apertura della pagina
        document.addEventListener("DOMContentLoaded", function() {
            addIngredientField();
        });
    </script>
</body>
</html>
