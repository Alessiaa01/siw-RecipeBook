<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiwRecipe - Benvenuto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/registrationSuccessful.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="magic-background"></div>

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        
        <div class="logo-container mb-5">
            <a href="/">
                <img src="/images/logo2.png" alt="SiwLogo" class="main-logo"/>
            </a>
        </div>

        <main class="grimorio-card shadow-lg text-center p-5">
            
            <div class="decorative-header mb-4">
                <i class="fa-solid fa-wand-magic-sparkles magic-sparkle-icon"></i>
                <h1 class="display-5">Registrazione Completata!</h1>
                <div class="ornament-divider">
                    <span class="line"></span>
                    <span class="symbol">✦</span>
                    <span class="line"></span>
                </div>
            </div>

            <div class="content-body">
                <p class="welcome-msg">
                    Benvenuto, <span class="highlight-name" th:text="${user.name}"></span>
                </p>
                
               
                
                <div class="seal-area">
                    <div class="seal-circle">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                </div>

                <div class="action-btn-container mt-5">
                    <a href="/login" class="btn-royal">
                        Accedi 
                        <i class="fa-solid fa-door-open ms-2"></i>
                    </a>
                </div>
            </div>
        </main>
        
       
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
