<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiwRecipe - Accesso</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/formLogin.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        .magic-field label {
            font-family: 'Cinzel', serif;
            color: #4A3B2A;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>

<body>
    
    <div class="enchanted-container container d-flex justify-content-center align-items-center min-vh-100 py-4">
        
        <div class="recipe-book-card position-relative col-12 col-md-8 col-lg-5">
            
            <div class="header-decoration text-center mb-4">
                <div class="icon-circle mb-2">
                    <i class="fas fa-castle crown-icon display-4"></i>
                </div>
                
                <h1 class="display-4 mb-0">Login</h1>
                
                <img src="/images/nastro.png" alt="decorazione" class="ribbon-decoration">
                
            </div>

            <div th:if="${param.error}" class="alert alert-danger text-center magic-alert mb-4" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> Username o Password errati!
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success text-center magic-alert mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i> Logout effettuato
            </div>

            <form th:action="@{/login}" method="POST" class="magic-form">
                
                <div class="mb-4">
                    <div class="magic-field">
                        <label for="username">Username</label>
                        <div class="field-wrapper">
                            <i class="fas fa-crown input-icon"></i>
                            <input id="username" name="username" type="text" class="form-control" required placeholder=""/>
                        </div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="magic-field">
                        <label for="password">Password</label>
                        <div class="field-wrapper">
                            <i class="fas fa-key input-icon"></i>
                            <input id="password" name="password" type="password" class="form-control" required placeholder=""/>
                        </div>
                    </div>
                </div>

				<div class="action-area text-center mt-4">
				    <button type="submit" class="royal-btn w-100 mb-3">
				        <span>Accedi</span>
				    </button>

				    <div class="d-flex align-items-center justify-content-center my-3">
				        <hr class="flex-grow-1" style="border-color: #4A3B2A; opacity: 0.3;">
				        <span class="mx-3" style="font-family: 'Cinzel', serif; color: #4A3B2A; font-size: 0.9rem;">OPPURE</span>
				        <hr class="flex-grow-1" style="border-color: #4A3B2A; opacity: 0.3;">
				    </div>

				    <a href="/oauth2/authorization/google" class="google-magic-btn w-100">
				        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
				        <span>Accedi con Google</span>
				    </a>
				</div>
                <div class="scroll-link text-center mt-4">
                    Non hai ancora un account? <br>
                    <a th:href="@{/register}">Registrati</a>
                </div>
                
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
