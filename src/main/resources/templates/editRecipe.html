<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Modifica: ' + ${recipe.title}">Modifica Ricetta</title>
    
    <link rel="stylesheet" th:href="@{/css/editRecipe.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="enchanted-container">
        
        <div class="recipe-book-card">
            <div class="card-content-wrapper">
                
                <div class="header-decoration">
                    <h1>Modifica Ricetta</h1>
                    <p class="subtitle" th:text="${recipe.title}">Nome Ricetta</p>
                </div>

                <form th:action="@{'/recipe/update/' + ${recipe.id}}" th:object="${recipe}" method="post" id="editForm">
                    
                    <div class="form-grid-layout">
                        
                        <div class="left-col">
                            
                            <div class="magic-field">
                                <label>Titolo Ricetta</label>
                                <div class="field-wrapper">
                                    <i class="fa-solid fa-heading input-icon"></i>
                                    <input type="text" th:field="*{title}" class="form-control" placeholder="Es. Torta di Mele"/>
                                </div>
                            </div>

                            <div class="magic-field">
                                <label>Descrizione Breve</label>
                                <div class="field-wrapper">
                                    <i class="fa-solid fa-quote-left input-icon"></i>
                                    <input type="text" th:field="*{description}" class="form-control" />
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                
                                <div class="magic-field">
                                    <label>Prep. (min)</label>
                                    <div class="field-wrapper">
                                        <i class="fa-regular fa-clock input-icon"></i>
                                        <input type="number" th:field="*{preparationTime}" class="form-control"/>
                                    </div>
                                </div>

                                <div class="magic-field">
                                    <label>Cottura (min)</label>
                                    <div class="field-wrapper">
                                        <i class="fa-solid fa-fire-burner input-icon"></i>
                                        <input type="number" th:field="*{cookingTime}" class="form-control"/>
                                    </div>
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                <div class="magic-field">
                                    <label>Difficoltà</label>
                                    <div class="field-wrapper">
                                        <i class="fa-solid fa-gauge-high input-icon"></i>
                                        <select th:field="*{difficulty}" class="form-control" style="padding-left: 45px;">
                                            <option value="Facile">Facile</option>
                                            <option value="Media">Media</option>
                                            <option value="Difficile">Difficile</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="magic-field">
                                    <label>Porzioni</label>
                                    <div class="field-wrapper">
                                        <i class="fa-solid fa-utensils input-icon"></i>
                                        <input type="number" th:field="*{servings}" class="form-control"/>
                                    </div>
                                </div>
                            </div>
                             
                             <div class="magic-field">
                                <label>Categoria</label>
                                <div class="field-wrapper">
                                    <i class="fa-solid fa-list input-icon"></i>
                                    <select th:field="*{category}" class="form-control" style="padding-left: 45px;">
                                        <option value="Antipasto">Antipasto</option>
                                        <option value="Primo">Primo</option>
                                        <option value="Secondo">Secondo</option>
                                        <option value="Dolce">Dolce</option>
                                        <option value="Altro">Altro</option>
                                    </select>
                                </div>
                            </div>

                            <div class="magic-field">
                                <label>URL Immagine</label>
                                <div class="field-wrapper">
                                    <i class="fa-regular fa-image input-icon"></i>
                                    <input type="text" th:field="*{imageUrl}" id="imgUrlInput" oninput="updatePreview()" class="form-control"/>
                                </div>
                            </div>
                            
                            <div class="image-preview-box">
                                <img id="preview-img" 
                                     th:src="${recipe.imageUrl} ? ${recipe.imageUrl} : '/images/placeholder-piatto.jpg'" 
                                     class="preview-frame" alt="Anteprima">
                            </div>

                        </div>

                        <div class="right-col">
                            
                            <div class="magic-field">
                                <label>Ingredienti</label>
                                <div class="ingredients-section">
                                    
                                    <div class="ing-list-scroll">
                                        <div th:each="ing : ${recipe.ingredients}" class="ing-row">
                                            <span class="ing-text">
                                                <i class="fa-solid fa-pepper-hot"></i>
                                                <span th:text="${ing.name} + ' (' + ${ing.quantity} + ' ' + ${ing.unit} + ')'"></span>
                                            </span>
                                            <button type="submit" 
                                                    th:form="'form-delete-' + ${ing.id}"
                                                    class="btn-delete-ing"
                                                    title="Rimuovi">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="add-ing-mini">
                                        <input type="text" name="name" placeholder="Nome" class="input-mini" style="flex: 2;"/>
                                        <input type="text" name="quantity" placeholder="Qt." class="input-mini" style="flex: 1; border-left: 1px solid #eee; padding-left: 5px;"/>
                                        <input type="text" name="unit" placeholder="Unità" class="input-mini" style="flex: 1; border-left: 1px solid #eee; padding-left: 5px;"/>
                                        
                                        <button type="submit" 
                                                th:formaction="@{'/recipe/' + ${recipe.id} + '/ingredient/add'}" 
                                                formnovalidate
                                                class="btn-add-mini"
                                                title="Aggiungi">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="magic-field">
                                <label>Procedimento</label>
                                <div class="field-wrapper">
                                    <textarea th:field="*{procedure}" class="form-control" placeholder="Descrivi i passaggi..."></textarea>
                                </div>
                            </div>

                        </div> </div> </form>

                <div class="form-actions">
                    <a th:href="@{'/recipe/' + ${recipe.id}}" class="btn-outline">Annulla</a>
                    <button type="submit" form="editForm" class="btn-royal">Salva Modifiche</button>
                </div>

            </div>
        </div>
    </div>

    <div th:each="ing : ${recipe.ingredients}">
        <form th:id="'form-delete-' + ${ing.id}" 
              th:action="@{'/recipe/' + ${recipe.id} + '/ingredient/' + ${ing.id} + '/remove'}" 
              method="post" 
              style="display: none;">
        </form>
    </div>

    <script>
        function updatePreview() {
            const url = document.getElementById('imgUrlInput').value;
            const img = document.getElementById('preview-img');
            if(url) {
                img.src = url;
                img.onerror = function() { this.src = '/images/placeholder-piatto.jpg'; };
            } else {
                img.src = '/images/placeholder-piatto.jpg';
            }
        }
    </script>

</body>
</html>
