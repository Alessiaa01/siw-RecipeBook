<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney RecipeBook - Elenco Ricette</title>
    
    <link rel="stylesheet" href="/css/recipes.css" />
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="magic-background"></div>

    <header class="main-header">
        <div class="header-content-wrapper">
            
            <div class="header-left">
                <div sec:authorize="hasAuthority('ADMIN')">
                    <a th:href="@{/admin/indexAdmin}" class="btn-admin-badge">
                        <i class="fa-solid fa-crown"></i> Gestione Admin
                    </a>
                </div>

                <div sec:authorize="isAuthenticated() and !hasAuthority('ADMIN')">
                    <a th:href="@{/myRecipes}" class="btn-my-recipes">
                        <i class="fa-solid fa-book-open"></i> Le mie ricette
                    </a>
                </div>
            </div>
            
            <div class="header-right">
				<div sec:authorize="isAuthenticated()" class="user-profile" style="display: flex; align-items: center; gap: 15px;">
				    <span class="chef-name">
				        <i class="fa-solid fa-user-circle"></i>
				        <a th:if="${currentUser != null}" 
				           th:href="@{'/user/' + ${currentUser.id}}" 
				           th:text="${currentUser.name} + ' ' + ${currentUser.surname}"
				           style="color: inherit; text-decoration: none;">
				            Nome Cognome
				        </a>
				        <span th:if="${currentUser == null}" sec:authentication="name">User</span>
				    </span>
				    
				    <form th:action="@{/logout}" method="post" style="margin: 0;">
				        <button type="submit" class="btn-logout-header">
				            Logout <i class="fa-solid fa-right-from-bracket"></i>
				        </button>
				    </form>
				</div>

                <div sec:authorize="!isAuthenticated()" class="guest-actions">
                    <span class="welcome-text">Benvenuto!</span>
                    <a th:href="@{/login}" class="btn-gold">Accedi</a>
                    <a th:href="@{/register}" class="btn-gold">Registrati</a>
                </div>
            </div>
        </div>
    </header>

    <div class="hero-section">
        <div class="logo-container">
            <a th:href="@{/}">
                <img src="/images/logo2.png" class="main-logo" alt="Disney Recipes" onerror="this.style.display='none'"/>
            </a>  
        </div>
        <h1 class="main-title">Il Ricettario Incantato</h1>
    </div>
    
    <div class="search-wrapper">
        <form th:action="@{/searchRecipes}" method="get" class="magic-search-form">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass icon-input"></i>
                <input type="text" name="title" placeholder="Cerca per Titolo..." />
            </div>

            <div class="input-group">
                <i class="fa-solid fa-wheat-awn icon-input"></i>
                <input type="text" name="ingredient" placeholder="Ingrediente..." />
            </div>
            
            <button type="submit" class="btn-search">Cerca</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(recipes)}" class="empty-message">
        <i class="fa-solid fa-cookie-bite"></i>
        <p>Oh no! Nessuna ricetta trovata.</p>
    </div>

    <div class="container">
        <ul class="recipe-grid">
            <li th:each="recipe : ${recipes}" class="recipe-card">
                
                <div class="card-image-wrapper">
                    <img th:src="${recipe.imageUrl} ? ${recipe.imageUrl} : '/images/placeholder-piatto.jpg'" 
                         th:alt="'Immagine di ' + ${recipe.title}" />
                    
                    <span class="difficulty-badge" th:text="${recipe.difficulty}">Facile</span>

                    <div class="rating-badge" title="Media Voti">
                        <i class="fa-solid fa-star"></i>
                        <span th:if="${not #lists.isEmpty(recipe.reviews)}" 
                              th:text="${#numbers.formatDecimal(#aggregates.avg(recipe.reviews.![rating]), 1, 1)}">4.5</span>
                        <span th:if="${#lists.isEmpty(recipe.reviews)}">-</span>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="favorite-action">
                        <form th:action="@{'/recipe/' + ${recipe.id} + '/favorite'}" method="post">
                            <button type="submit" class="btn-favorite" title="Aggiungi/Rimuovi dai preferiti">
                                <i th:if="${currentUser != null and #sets.contains(currentUser.favoriteRecipes, recipe)}" class="fa-solid fa-heart" style="color: #e74c3c;"></i>
                                <i th:unless="${currentUser != null and #sets.contains(currentUser.favoriteRecipes, recipe)}" class="fa-regular fa-heart"></i>
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="card-content">
                    <a th:href="@{'/recipe/' + ${recipe.id}}" class="recipe-title">
                        <span th:text="${recipe.title}">Titolo Ricetta</span>
                    </a>
                    
                    <p class="recipe-description" th:text="${recipe.description}">Descrizione...</p>

                    <div class="card-divider"></div>

                    <div class="card-footer">
                        <div class="meta-info">
                            <span class="meta-item" title="Tempo di preparazione">
                                <i class="fa-regular fa-clock"></i> 
                                <span th:text="${recipe.preparationTime}">0</span>'
                            </span>

                            <span class="meta-item" title="Porzioni">
                                <i class="fa-solid fa-users"></i> 
                                <span th:text="${recipe.servings}">2</span>
                            </span>
                        </div>

                        <span class="meta-item author">
                            <i class="fa-solid fa-user-pen"></i>
                            <a th:if="${recipe.author != null}" 
                               th:href="@{'/user/' + ${recipe.author.id}}" 
                               class="author-link">
                               <span th:text="${recipe.author.name}">Chef</span>
                            </a>
                            <span th:unless="${recipe.author != null}">Anonimo</span>
                        </span>
                        
                        <div class="date-info" th:if="${recipe.creationDate}">
                            <i class="fa-regular fa-calendar-days"></i>
                            <span th:text="${#temporals.format(recipe.creationDate, 'dd/MM/yyyy')}"></span>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>

</body>
</html>
