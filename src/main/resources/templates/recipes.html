<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney RecipeBook - Elenco Ricette</title>
    
    <link rel="stylesheet" href="/css/recipes.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="magic-background"></div>

    <header class="main-header">
        <div class="header-content-wrapper">
            
            <div class="header-left">
                
                <div sec:authorize="hasAuthority('ADMIN')" class="admin-badge">
                    <a th:href="@{/admin}" class="btn-text">
                        <i class="fa-solid fa-crown"></i> Gestione Admin
                    </a>
                </div>

                <div sec:authorize="isAuthenticated() and !hasAuthority('ADMIN')">
                    <a th:href="@{/myRecipes}" class="btn-gold-outline">
                        <i class="fa-solid fa-book-open"></i> Le mie ricette
                    </a>
                </div>
            </div>
            
            <div class="header-right">
                
                <div sec:authorize="isAuthenticated()" class="user-profile">
                    <span class="chef-name">
                        ✨ Chef 
                        <span th:if="${currentUser != null}" th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Nome Cognome</span>
                        <span th:if="${currentUser == null}" sec:authentication="name">User</span>
                    </span>
                    <a th:href="@{/logout}" class="btn-logout">Logout</a>
                </div>

                <div sec:authorize="!isAuthenticated()" class="guest-actions">
                    <span class="welcome-text">Benvenuto!</span>
                    <a th:href="@{/login}" class="btn-gold">Accedi</a>
                    <a th:href="@{/register}" class="btn-gold-outline">Registrati</a>
                </div>
                
            </div>
        </div>
    </header>

    <div class="hero-section">
        <div class="logo-container">
            <a th:href="@{/}">
                <img src="/images/logo2.png" class="main-logo" alt="Disney Recipes" onerror="this.style.display='none'"/>
            </a>  
        </div>
        <h1 class="main-title">Il Ricettario Incantato</h1>
    </div>
    
    <div class="search-wrapper">
        <form th:action="@{/searchRecipes}" method="get" class="magic-search-form">
            
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass icon-input"></i>
                <input type="text" name="title" placeholder="Cerca per Titolo..." />
            </div>

            <div class="input-group">
                <i class="fa-solid fa-wheat-awn icon-input"></i>
                <input type="text" name="ingredient" placeholder="Ingrediente..." />
            </div>
            
            <button type="submit" class="btn-search">Cerca Magia</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(recipes)}" class="empty-message">
        <i class="fa-solid fa-cookie-bite"></i>
        <p>Oh no! Nessuna ricetta trovata nel calderone.</p>
    </div>

    <div class="container">
        <ul class="recipe-grid">
            <li th:each="recipe : ${recipes}" class="recipe-card">
                
                <div class="card-image-wrapper">
                    <img th:src="${recipe.imageUrl} ? ${recipe.imageUrl} : '/images/placeholder-piatto.jpg'" 
                         th:alt="'Immagine di ' + ${recipe.title}" />
                    
                    <span class="difficulty-badge" th:text="${recipe.difficulty}">Facile</span>
                </div>
                
                <div class="card-content">
                    <a th:href="@{'/recipe/' + ${recipe.id}}" class="recipe-title">
                        <span th:text="${recipe.title}">Titolo Ricetta</span>
                    </a>
                    
                    <p class="recipe-description" th:text="${recipe.description}">Descrizione...</p>

                    <div class="card-divider"></div>

                    <div class="card-footer">
                        <div class="meta-info">
                            <span class="meta-item"><i class="fa-regular fa-clock"></i> <span th:text="${recipe.preparationTime}">0</span>'</span>
                            <span class="meta-item author">
                                <i class="fa-solid fa-user-pen"></i>
                                <span th:if="${recipe.author != null}" th:text="${recipe.author.name}">Chef</span>
                                <span th:unless="${recipe.author != null}">Anonimo</span>
                            </span>
                        </div>
                        
                        <div class="date-info" th:if="${recipe.creationDate}">
                            <span th:text="${#temporals.format(recipe.creationDate, 'dd/MM/yyyy')}"></span>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>

</body>
</html>
