<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Utenti - RecipeBook</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" th:href="@{/css/manageUsers.css}" />
</head>
<body>

	<header>
	        <div class="header-content-wrapper">
	            
				<div class="header-left">
				    
				    <div class="admin-link-header-left">
				        <a th:href="@{/}">
				            <i class="fa-solid fa-house-chimney"></i> Home
				        </a>
				    </div>

				    <div sec:authorize="hasAuthority('ADMIN')" class="admin-link-header-left">
				        <a th:href="@{/admin/indexAdmin}">
				            <i class="fa-solid fa-crown"></i> Gestione Admin
				        </a>
				    </div>

				</div>

	            <div class="user-actions-right">
					<span class="chef-name">
									  <i class="fa-solid fa-user-circle"></i>
					                       <span th:if="${currentUser != null}" th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Nome Cognome</span>
					                       <span th:if="${currentUser == null}" sec:authentication="name">User</span>
										
					                   </span>
	                
	                <a th:href="@{/logout}" class="btn-logout">
	                   Logout <i class="fa-solid fa-right-from-bracket"></i> 
	                </a>
	            </div>

	        </div>
	    </header>
    <div class="hero-section">
        <div class="main-logo">
          
        </div>
        <h1 class="main-title">Registro Utenti</h1>
    </div>

    <div class="container user-container">
        <div class="parchment-panel">
            <div class="panel-header">
                <h3><i class="fas fa-scroll"></i> Elenco Iscritti</h3>
                <span class="user-count" th:text="${credentialsList != null ? credentialsList.size() + ' Utenti' : '0 Utenti'}">0 Utenti</span>
            </div>

            <div class="table-responsive">
                <table class="magic-table">
                    <thead>
                        <tr>
                            <th>Avatar</th>
                            <th>Nome Utente</th>
                            <th>Email</th>
                            <th>Ruolo</th>
                            <th>Stato</th> <th class="text-right">Azioni</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <tr th:each="user : ${credentialsList}" 
                            th:classappend="${!user.enabled} ? 'row-banned' : ''">
                            
                            <td>
                                <div class="user-avatar-circle">
                                    <span th:text="${#strings.substring(user.username,0,1).toUpperCase()}">U</span>
                                </div>
                            </td>
                            
                            <td class="font-title" th:text="${user.username}"
                                th:style="${!user.enabled} ? 'text-decoration: line-through; color: #999;' : ''">
                                MarioRossi
                            </td>
                            
                            <td th:text="${user.user != null ? user.user.email : 'N/A'}">email@example.com</td>
                            
                            <td>
                                <span class="role-badge" 
                                      th:classappend="${user.role == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                                      th:text="${user.role}">USER</span>
                            </td>

                            <td>
                                <span th:if="${user.enabled}" class="status-badge badge-active">
                                    <i class="fas fa-check-circle"></i> Attivo
                                </span>
                                <span th:if="${!user.enabled}" class="badge-banned">
                                    <i class="fas fa-user-slash"></i> Disabilitato
                                </span>
                            </td>
                            
							<td class="text-right">
							    <div class="action-buttons" style="display: flex; justify-content: flex-end; gap: 10px;">
							        
							        <div th:if="${user.username != #authentication.name}" style="display: flex; gap: 10px;">
							            
							            <form th:if="${user.enabled}" 
							                  th:action="@{'/admin/users/' + ${user.username} + '/ban'}" 
							                  method="post" style="margin:0;">
							                
							                <button type="submit" class="btn-magic btn-ban-magic" 
							                        onclick="return confirm('Sei sicuro di voler bloccare l\'accesso a questo utente nel regno?');">
							                    <i class="fas fa-user-slash"></i>
							                    <span>Blocca</span>
							                </button>
							            </form>

							            <form th:if="${!user.enabled}" 
							                  th:action="@{'/admin/users/' + ${user.username} + '/unban'}" 
							                  method="post" style="margin:0;">
							                  
							                <button type="submit" class="btn-magic btn-unban-magic" 
							                        onclick="return confirm('Vuoi riammettere questo utente nel regno?');">
							                    <i class="fas fa-user-check"></i>
							                    <span>Attiva</span>
							                </button>
							            </form>

							        </div>

							        <span th:if="${user.username == #authentication.name}" 
							              class="current-user-tag">
							            <i class="fas fa-user-circle"></i> (Tu)
							        </span>
							    </div>
							</td>
                        </tr>
                        
                        <tr th:if="${credentialsList == null or credentialsList.empty}">
                            <td colspan="6" class="empty-row">
                                <i class="fas fa-wind"></i> Nessun utente trovato nel regno.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="magic-background"></div>
</body>
</html>
