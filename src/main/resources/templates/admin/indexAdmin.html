<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SiwRecipe - Admin</title>
    
    <link rel="stylesheet" href="/css/indexAdmin.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    
	<header class="main-header">
	    <div class="header-content-wrapper">
	        
	        <div class="header-left">
	            <a th:href="@{/}" class="btn-home-royal">
	                <i class="fa-solid fa-house-chimney"></i> Home
	            </a>
	        </div>
	        
	        <div class="header-right">
	            <div sec:authorize="isAuthenticated()" class="user-profile" style="display: flex; align-items: center; gap: 15px;">
	                
	                <a th:if="${currentUser != null}" th:href="@{'/user/' + ${currentUser.id}}" 
	                   class="chef-name" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px;">
	                    <i class="fa-solid fa-user-circle"></i>
	                    <span th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Admin</span>
	                </a>
	                
	                <span th:if="${currentUser == null}" class="chef-name">
	                    <i class="fa-solid fa-user-circle"></i>
	                    <span sec:authentication="name">User</span>
	                </span>

	                <form th:action="@{/logout}" method="post" style="margin: 0;">
	                    <button type="submit" class="btn-logout">
	                        Logout <i class="fa-solid fa-right-from-bracket"></i>
	                    </button>
	                </form>
	            </div>
	        </div>

	    </div>
	</header>

    <div class="logo-container">
        <a href="/"><img src="/images/logo2.png" class="main-logo" onerror="this.style.display='none'"/></a>
        <h1 class="main-title">Pannello di Controllo</h1>
    </div>
    
    <div class="dashboard-container">
            
        <div class="dashboard-card">
            <span class="icon"><i class="fa-solid fa-book-open"></i></span>
            <h2>Ricette</h2>
            <p>Aggiungi, modifica o cancella le ricette del sito</p>
            <a href="/admin/manageRecipes" class="dashboard-btn">Gestisci ricette</a>
        </div>

        <div class="dashboard-card">
            <span class="icon"><i class="fa-solid fa-users"></i></span>
            <h2>Utenti</h2>
            <p>Visualizza gli iscritti e gestisci i ban</p>
            <a href="/admin/manageUsers" class="dashboard-btn">Gestisci utenti</a>
        </div>
        
       
    

    </div>
   
</body>
</html>
