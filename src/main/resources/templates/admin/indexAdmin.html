<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SiwRecipe - Admin</title>
    
    <link rel="stylesheet" href="/css/indexAdmin.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    
    <header>
        <div class="header-content-wrapper">
            
            <div class="admin-link-header-left">
                <a href="/">
                    <i class="fa-solid fa-house-chimney"></i> Home
                </a>
            </div>

            <div class="user-actions-right">
				<span class="chef-name">
								  <i class="fa-solid fa-user-circle"></i>
				                       <span th:if="${currentUser != null}" th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Nome Cognome</span>
				                       <span th:if="${currentUser == null}" sec:authentication="name">User</span>
									
				                   </span>
                
                <a th:href="@{/logout}" class="btn-logout">
                   Logout <i class="fa-solid fa-right-from-bracket"></i> 
                </a>
            </div>

        </div>
    </header>

    <div class="logo-container">
        <a href="/"><img src="/images/logo2.png" class="main-logo" onerror="this.style.display='none'"/></a>
        <h1 class="main-title">Pannello di Controllo</h1>
    </div>
    
    <div class="dashboard-container">
            
        <div class="dashboard-card">
            <span class="icon"><i class="fa-solid fa-book-open"></i></span>
            <h2>Ricette</h2>
            <p>Aggiungi, modifica o cancella le ricette del sito</p>
            <a href="/admin/recipes" class="dashboard-btn">Gestisci ricette</a>
        </div>

        <div class="dashboard-card">
            <span class="icon"><i class="fa-solid fa-users"></i></span>
            <h2>Utenti</h2>
            <p>Visualizza gli iscritti e gestisci i ban</p>
            <a href="/admin/users" class="dashboard-btn">Gestisci utenti</a>
        </div>
        
       
    

    </div>
   
</body>
</html>
