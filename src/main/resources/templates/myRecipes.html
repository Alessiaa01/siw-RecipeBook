<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Le mie Ricette</title>
    <link rel="stylesheet" th:href="@{/css/myRecipes.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="magic-background-layer"></div>

    <header class="main-header">
        <div class="header-content-wrapper">
            <div class="header-left">
                <div class="admin-link-header-left">
                    <a th:href="@{/}"><i class="fa-solid fa-home"></i> Home</a>
                </div>
            </div>
            
            <div class="header-right user-actions-right">
                 <div th:if="${currentUser}" class="chef-name">
                    <i class="fa-solid fa-user-circle"></i> 
                    <span th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Utente</span>
                </div>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn-logout">Logout <i class="fa-solid fa-right-from-bracket"></i></button>
                </form>
            </div>
        </div>
    </header>

    <div class="enchanted-container">
        <div class="parchment-panel">
            
            <div class="panel-header-top">
                <h1 class="main-title">Le mie Ricette</h1>
               
            </div>

            <div class="panel-actions-bar">
                <div class="stats-info">
                   
                </div>
                <a th:href="@{/formNewRecipe}" class="btn-add-recipe">
                    <i class="fa-solid fa-feather-alt"></i> Nuova Ricetta
                </a>
            </div>

            <div th:if="${recipes==null || recipes.isEmpty()}" class="empty-state-magic">
                <p>Non ci sono ricette</p>
               
            </div>

            <table th:unless="${recipes.isEmpty()}" class="magic-table">
                <thead>
                    <tr>
                        <th>Piatto</th>
                        <th>Categoria</th> <th>Data</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="recipe : ${recipes}">
                        <td>
                            <div class="recipe-title-wrapper">
                              
                                <a th:href="@{'/recipe/' + ${recipe.id}}" class="recipe-link" th:text="${recipe.title}">Nome</a>
                            </div>
                        </td>
                        
                        <td th:text="${recipe.category}">Categoria</td>
                        
                        <td>
                            <span class="date-badge">
                                <i class="far fa-clock"></i>
                                <span th:text="${recipe.creationDate}">Data</span>
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons-wrapper">
                                <a th:href="@{'/recipe/' + ${recipe.id}}" class="btn-action btn-view" title="Vedi"><i class="fa-solid fa-eye"></i></a>
                                
                                <a th:href="@{'/recipe/edit/' + ${recipe.id}}" class="btn-action btn-edit" title="Modifica"><i class="fa-solid fa-pen-nib"></i></a>
                                
                                <form th:action="@{'/recipe/delete/' + ${recipe.id}}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn-action btn-delete" title="Elimina" onclick="return confirm('Eliminare definitivamente questa ricetta?');">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

          
        </div>
    </div>
</body>
</html>
