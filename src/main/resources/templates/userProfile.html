<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="'Profilo di ' + ${user.name}">Profilo</title>
    <link rel="stylesheet" th:href="@{/css/UserProfile.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="header-content-wrapper">
            
            <div class="header-left">
                
                <a th:href="@{/}" class="btn-home-royal">
                    <i class="fa-solid fa-house-chimney"></i> Home
                </a>
                
                <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/admin}" class="btn-home-royal">
                    <i class="fa-solid fa-crown"></i> Gestione Admin
                </a>
                
                <a sec:authorize="isAuthenticated() and !hasAuthority('ADMIN')" th:href="@{/myRecipes}" class="btn-home-royal">
                    <i class="fa-solid fa-book-open"></i> Le mie ricette
                </a>
                
            </div>
            
            <div class="header-right">
                
                <div sec:authorize="isAuthenticated()" class="user-profile">
                    <span class="chef-name">
                        <i class="fa-solid fa-user-circle"></i>
                        <span th:if="${currentUser != null}" th:text="${currentUser.name} + ' ' + ${currentUser.surname}">Nome Cognome</span>
                        <span th:if="${currentUser == null}" sec:authentication="name">User</span>
                    </span>
                    
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="btn-logout">
                            Logout <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </form>
                </div>
                
                <div sec:authorize="!isAuthenticated()" class="header-right" style="gap: 10px;">
                    <span class="welcome-text" style="font-weight: bold; color: #5D4037; margin-right: 5px;">Benvenuto!</span>
                    
                    <a th:href="@{/login}" class="btn-home-royal">Accedi</a>
                    <a th:href="@{/register}" class="btn-gold-outline" style="background: white;">Registrati</a>
                </div>
                
            </div>
        </div>
    </header>

    <div class="enchanted-container">
        <div class="profile-card">
            <div class="card-content-wrapper">
                
                <header class="profile-header">
                    <div class="avatar-circle">
                        <span th:text="${user.name != null ? #strings.substring(user.name, 0, 1) : 'U'}">U</span>
                    </div>
                    
                    <h1 th:text="${user.name} + ' ' + ${user.surname}">Nome Cognome</h1>
                    
                    <p class="user-meta">
                        <i class="fa-solid fa-envelope"></i> 
                        <span th:text="${user.email}">email</span>
                    </p>
                    
                    <p class="user-meta" th:if="${user.dateOfBirth != null}">
                        <i class="fa-solid fa-cake-candles"></i>
                        <span th:text="${#temporals.format(user.dateOfBirth, 'dd MMMM yyyy')}">Data</span>
                    </p>
                </header>

                <div class="divider"></div>

                <section class="user-recipes-section">
                    <h2>Ricette dello Chef</h2>

                    <div th:if="${userRecipes.isEmpty()}" class="empty-state">
                        <p>Nessuna ricetta pubblicata.</p>
                    </div>

                    <ul th:unless="${userRecipes.isEmpty()}" class="recipe-list">
                        <li th:each="recipe : ${userRecipes}">
                            
                            <a th:href="@{'/recipe/' + ${recipe.id}}" class="recipe-card-mini">
                                
                                <div>
                                    <span class="recipe-link" th:text="${recipe.title}">Nome Ricetta</span>
                                    
                                    <span class="recipe-difficulty" 
                                          th:if="${recipe.difficulty != null}" 
                                          th:text="${recipe.difficulty}">
                                    </span>
                                </div>
                                
                                <i class="fa-solid fa-chevron-right btn-icon-go"></i>
                            </a>

                        </li>
                    </ul>
                </section>
                
            </div>
        </div>
    </div>

</body>
</html>
